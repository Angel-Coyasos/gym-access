services:

  # ─── Aplicación Laravel (PHP-FPM + Queue Worker) ───────────────────────────
  app:
    build:
      context: .
      
      dockerfile: docker/Dockerfile
      args:
        user: laravel
        uid: 1000
    container_name: gym_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gym_network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  # ─── Nginx (Web Server) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gym_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gym_network

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: gym_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gym_db}
      POSTGRES_USER: ${DB_USERNAME:-gym_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gym_password}
    volumes:
      - gym_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gym_user} -d ${DB_DATABASE:-gym_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gym_network

  # ─── Redis (Broker de colas) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gym_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-gym_redis_pass}
    volumes:
      - gym_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gym_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gym_network

# ─── Volúmenes persistentes ──────────────────────────────────────────────────
volumes:
  gym_db_data:
    driver: local
  gym_redis_data:
    driver: local

# ─── Red interna ─────────────────────────────────────────────────────────────
networks:
  gym_network:
    driver: bridge