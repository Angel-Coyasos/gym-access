[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ─── PHP-FPM ────────────────────────────────────────────────────────────────
[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ─── Queue Worker (Engagement consumer) ─────────────────────────────────────
[program:queue-worker]
command=php /var/www/artisan queue:work redis --sleep=3 --tries=3 --backoff=30,120,300 --timeout=90 --queue=engagement,default
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

; ─── Outbox Worker (publica eventos pendientes al broker) ────────────────────
[program:outbox-worker]
command=php /var/www/artisan outbox:publish --interval=5
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0